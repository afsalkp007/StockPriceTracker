name: CI-macOS

on:
  push:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: macos-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Build and Test
      run: xcodebuild clean build test -project StockPriceTracker/StockPriceTracker.xcodeproj -scheme "CI-macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -sdk macosx -destination "platform=macOS" ONLY_ACTIVE_ARCH=YES
