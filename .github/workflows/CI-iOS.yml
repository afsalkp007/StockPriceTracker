name: CI-iOS

on:
  push:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: macos-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Build and Test
      run: xcodebuild clean build test -workspace StockPriceTrackerApp/StockPriceTrackerApp.xcworkspace -scheme "CI-iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" ONLY_ACTIVE_ARCH=YES
